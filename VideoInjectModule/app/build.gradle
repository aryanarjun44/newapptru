plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.local.videoinject'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.local.videoinject'
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Xposed/LSPosed API stand-in (compile only, the real one is provided by LSPosed at runtime)
    compileOnly project(':xposed-api')
}
